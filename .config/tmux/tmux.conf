##############################################################################################
# PLUGINS
##############################################################################################
# plugin manager
set -g @plugin 'tmux-plugins/tpm'

# sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# theme
# set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'danjvarela/tmux-gruvbox'

# for pane navigation
set -g @plugin 'tmux-plugins/tmux-pain-control'

# for yanking text
set -g @plugin 'tmux-plugins/tmux-yank'

# save sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# floating panes
set -g @plugin 'omerxx/tmux-floax'

# session management
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

##############################################################################################

##############################################################################################
# THEME
##############################################################################################

# set -g @catppuccin_flavor 'mocha'
# set -g @catppuccin_window_text " #W"
# set -g @catppuccin_window_current_text " #W"
# set -g @catppuccin_window_status_style "rounded"
#
# set -g status-right "#{E:@catppuccin_status_session}"
# set -g status-left ""

set -g @gruvbox_flavour 'material'

set -g @gruvbox_window_current_fill "all"
set -g @gruvbox_window_default_fill "all"

set -g @gruvbox_window_middle_separator " "
##############################################################################################

##############################################################################################
# MISC
##############################################################################################

set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*:Tc"

# prevent auto renaming of windows
set-option -wg automatic-rename off
set-option -wg allow-rename off 

# enable mouse support
set -g mouse on

# enable vi mode and use vim-like selection key bindings when copying
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# copy to system clipboard
set-option -g set-clipboard on

set-option -g @pane-resize "2"

# we add another binding for clearing the screen
# bind C-l send-keys 'C-l'

#main toggle floating pane
set -g @floax-bind 'C-f'
##############################################################################################

run '~/.config/tmux/plugins/tpm/tpm'
